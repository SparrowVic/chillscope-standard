<app-page-header titleKey="dashboard.title" subtitleKey="dashboard.subtitle" icon="gauge-high">
  <app-live-toggle
    [enabled]="measurements.liveEnabled()"
    (enabledChange)="measurements.setLiveEnabled($event)"
  />
</app-page-header>

<app-dashboard-filters
  [available]="measurements.catalogue()"
  [selected]="measurements.selectedSeries()"
  [range]="measurements.range()"
  [bucket]="measurements.bucket()"
  (selectedChange)="measurements.setSeries($event)"
  (rangeChange)="onFilterRangeChange($event.from, $event.to)"
  (bucketChange)="measurements.setBucket($event)"
  (bucketReset)="measurements.resetBucket()"
/>

@if (measurements.error()) {
  <app-error-panel
    titleKey="errors.loadMeasurements"
    [retrying]="measurements.isLoading()"
    (retry)="measurements.reload()"
  />
}

<section class="dashboard__chart-area" [attr.aria-label]="'dashboard.chart.title' | transloco">
  @defer (on viewport; prefetch on idle) {
    <app-chart-panel
      [series]="measurements.series()"
      [theme]="theme()"
      [loading]="measurements.isInitialLoading()"
      [zoomDepth]="chartZoomDepth()"
      [resetKey]="chartResetKey()"
      (rangeSelected)="onChartRangeSelected($event)"
      (undoRange)="undoChartRange()"
      (restoreRange)="restoreChartRange()"
    />
  } @placeholder {
    <div class="dashboard__chart-slot cs-panel" role="status">
      <span class="sr-only">{{ 'common.loading' | transloco }}</span>
      <p-skeleton width="11rem" height="1rem" borderRadius="4px" />
      <div class="dashboard__chart-skeleton-body">
        <p-skeleton width="100%" height="100%" borderRadius="6px" />
      </div>
    </div>
  } @error {
    <app-error-panel titleKey="chart.error" messageKey="errors.generic" (retry)="reloadPage()" />
  }
</section>

<section class="dashboard__cycle-area">
  @defer (on viewport; prefetch on idle) {
    <app-cycle-panel [theme]="theme()" />
  } @placeholder {
    <div class="dashboard__cycle-slot cs-panel" role="status">
      <span class="sr-only">{{ 'common.loading' | transloco }}</span>
      <p-skeleton width="11rem" height="1rem" borderRadius="4px" />
      <div class="dashboard__chart-skeleton-body">
        <p-skeleton width="100%" height="100%" borderRadius="6px" />
      </div>
    </div>
  } @error {
    <app-error-panel titleKey="chart.error" messageKey="errors.generic" (retry)="reloadPage()" />
  }
</section>

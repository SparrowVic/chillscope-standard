<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Chillscope</title>
    <base href="/" />
    <!-- Paint under notches and resize the layout viewport when the mobile keyboard opens. Fixed
         surfaces restore safe-area clearance with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d0f" />
    <!-- Safari uses these instead of the manifest's install metadata. -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Run before Angular boots to avoid a white first paint in dark mode.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('chillscope.settings') || '{}').theme;
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('app-dark');
            document.documentElement.style.background = '#0c0d0f';
          }
        } catch (e) {
          /* first paint falls back to light */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
